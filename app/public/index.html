<!doctype html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>店小智 · 门店经营工作台</title><link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="import-workflow.css"><script src="lib/echarts.min.js" defer></script><script src="lib/xlsx.full.min.js" defer></script><script type="module" src="app.mjs"></script></head>
<body>
  <aside class="sidebar">
    <a class="brand" href="#dashboard"><span class="logo">店</span><span><strong>店小智</strong><small>让小店经营，更有依据</small></span></a>
    <nav aria-label="主导航">
      <p class="nav-group">门店工作台</p>
      <a href="#dashboard" data-nav="dashboard"><span>◫</span>经营仪表盘</a>
      <a href="#products" data-nav="products"><span>▦</span>商品与库存</a>
      <a href="#activity" data-nav="activity"><span>≡</span>经营流水</a>
      <a href="#imports" data-nav="imports"><span>⇧</span>数据导入</a>
      <p class="nav-group">财务报表</p>
      <a href="#profit" data-nav="profit"><span>↗</span>利润表</a>
      <a href="#balance" data-nav="balance"><span>▤</span>资产负债表</a>
      <a href="#cashflow" data-nav="cashflow"><span>⇄</span>现金流量表</a>
      <p class="nav-group">经营助手</p>
      <a href="#operations" data-nav="operations"><span>✓</span>经营建议与复盘</a>
      <a href="#assistant" data-nav="assistant"><span>✧</span>AI 聊天与查数<span class="nav-new">NEW</span></a>
      <a href="#settings" data-nav="settings"><span>⚙</span>门店与数据</a>
    </nav>
    <div class="side-foot"><span class="status-dot"></span>本地工作台 · v0.3<small>数据保存在此浏览器<br>重要记录请定期导出备份</small></div>
  </aside>
  <main>
    <header class="top"><div class="store-name"><span class="store-icon">▣</span><div><strong id="store-title"></strong><small id="save-status">本地保存</small></div></div><div class="top-actions"><span id="mode-badge" class="badge"></span><button id="switch-mode" class="button subtle"></button></div></header>
    <div id="mode-notice" class="notice"></div>
    <section class="page-heading"><div><p class="eyebrow">DIANXIAOZHI / STORE WORKSPACE</p><h1 id="page-title"></h1><p id="page-description"></p></div><div id="heading-actions"></div></section>
    <form id="period-form" class="period"><span>统计期间</span><label>开始<input aria-label="开始日期" id="date-start" type="date" required></label><span class="muted">—</span><label>结束<input aria-label="结束日期" id="date-end" type="date" required></label><button class="button subtle">应用</button><button type="button" id="this-month" class="text-button">本月</button></form>
    <div id="content"></div>
    <footer class="footer">店小智 v0.3 · 数据录入 → 经营分析 → 执行复盘<span>单门店本地版</span></footer>
  </main>
  <dialog id="edit-dialog"><form id="edit-form"><div class="dialog-head"><h2 id="dialog-title"></h2><button type="button" id="dialog-close" aria-label="关闭">×</button></div><div id="dialog-fields"></div><p id="form-error" role="alert" class="error"></p><div class="dialog-actions"><button type="button" id="dialog-cancel" class="button subtle">取消</button><button class="button primary">保存记录</button></div></form></dialog>
  <div id="toast" role="status" class="toast" hidden></div>
</body></html>
