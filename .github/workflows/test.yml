name: Project checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run domain and server tests
        working-directory: app
        run: npm test
      - name: Verify static deployment bundle
        working-directory: app
        run: npm run build:pages
      - name: Verify CloudBase HTTP function package
        working-directory: app
        run: npm run build:cloudbase
